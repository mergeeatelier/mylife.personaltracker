name: Reminders
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: reminders
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - run: node scripts/send-reminders.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
  # กันไม่ให้ GitHub หยุดรันเองเมื่อ repo ไม่มีการแก้ไขครบ 60 วัน (ทำสัปดาห์ละครั้ง)
  keepalive:
    if: github.event.schedule == '17 3 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/reminders.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
